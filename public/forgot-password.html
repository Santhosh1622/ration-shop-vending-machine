<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Ration Generator</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="login-page">
    <div class="login-card" id="forgotCard">
        <h2 class="view-title" style="text-align:center; margin-bottom: 30px;">Forgot Password</h2>
        
        <!-- Step 1: Mobile -->
        <div id="forgot-step1">
            <div class="form-group mb-4">
                <input type="tel" id="forgotMobile" class="form-input" placeholder="Enter Registered Mobile Number" style="border: 2px solid var(--text-primary); border-radius: 8px;" />
            </div>
            <div style="text-align:center;">
                <button class="btn-outline" style="width: 140px; border-radius: 12px;" onclick="handleForgotSubmit()">Submit</button>
            </div>
        </div>

        <!-- Step 2: New Password (Hidden by default) -->
        <div id="forgot-step2" style="display:none;">
            <div style="text-align:center; margin-bottom: 20px;">
                <span style="font-size: 2rem;">➔</span>
            </div>
            <div class="form-group mb-2">
                <input type="password" class="form-input" placeholder="New password" style="border: 2px solid var(--text-primary); border-radius: 8px;" />
            </div>
            <div class="form-group mb-4">
                <input type="password" class="form-input" placeholder="Confirm new password" style="border: 2px solid var(--text-primary); border-radius: 8px;" />
            </div>
            <div style="text-align:center;">
                <button class="btn-outline" style="width: 140px; border-radius: 12px;" onclick="window.location.href='/login.html'">Submit</button>
            </div>
        </div>

        <div style="text-align:center; margin-top: 20px;">
            <a href="/login.html" style="color:var(--text-secondary); text-decoration:none; font-size:0.85rem;">Back to Login</a>
        </div>
    </div>

    <script>
        function handleForgotSubmit() {
            const mobile = document.getElementById('forgotMobile').value;
            if (mobile.length >= 10) {
                document.getElementById('forgot-step1').style.display = 'none';
                document.getElementById('forgot-step2').style.display = 'block';
            } else {
                alert('Please enter a valid mobile number');
            }
        }
    </script>
</body>

</html>
